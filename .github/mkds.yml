fuzz-test:
  runs-on: ubuntu-latest
  steps:
    - name: Trigger Remote Fuzzer
      run: |
        curl -sSN -f -X POST https://fuzzer.lonlonlabs.dev/api/fuzz \
             -H "x-api-key: ${{ secrets.FUZZER_API_KEY }}" \
             -H "Content-Type: application/json" \
             -d '{
               "repo_url": "https://github.com/${{ github.repository }}",
               "apworld_name": "mkds",
               "branch": "${{ github.ref_name }}",
               "runs": 1000
             }'
